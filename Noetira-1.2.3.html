<h2>Noetira 1.2.3（Build 53）</h2>
<h3>新增</h3>
<ul>
<li>错题细分题型与易错原因支持常驻自定义：录入一次后，后续在录入和编辑时可直接选择。</li>
<li>错题提交后可在“更多”菜单点击“编辑分类”，随时修改主要模块、细分题型、易错原因和自定义说明。</li>
<li>Hermes 接口新增错题分类读取、修改与自定义选项管理：GET/POST /api/learning/mistake-options、POST /api/learning/mistakes/&lt;编号&gt;。</li>
</ul>
<p>岗位信息、AI 核验、公告线索和本地初筛均为辅助信息，最终以招录机关官方公告和资格审查为准。</p>
